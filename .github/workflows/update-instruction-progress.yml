
name: Update Instruction Progress

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/update_instruction_progress.py"
      - "README.md"
      - ".github/workflows/update-instruction-progress.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update instruction progress
        run: python3 scripts/update_instruction_progress.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/instruction-progress.svg

          if ! git diff --cached --quiet; then
            git commit -m "docs: update instruction progress"
            git push
          else
            echo "Instruction progress is already up to date."
          fi
